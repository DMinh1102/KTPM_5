<!-- src/renderer/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdownify</title>
  
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="styles/codemirror.css">
  <link rel="stylesheet" href="styles/style.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles/base16-dark.css">
  <link rel="stylesheet" href="styles/bootstrap.min.css">
  <link rel="stylesheet" href="styles/default.css">
  <link rel="stylesheet" href="styles/dialog.css">
  <link rel="stylesheet" href="styles/dracula.css">
  <link rel="stylesheet" href="styles/font-awesome.min.css">
  <link rel="stylesheet" href="styles/katex.min.css">
  <link rel="stylesheet" href="styles/main.css">


</head>
<body>
  <div id="app">
    <div id="options-container"></div>
    <!-- Toolbar -->
    <div id="toolbar-container"></div>
    
    <!-- Main Content -->
    <div id="main-content" class="container">
      <!-- Editor -->
      <div id="editor-container" class="pane resizable-pane" style="padding-top: 24px;"></div>
      <!-- Dividing line-->
      <div id="divider" class="divider"></div>
      <!-- Preview -->
      <div id="preview-container" class="pane resizable-pane" style="padding-top: 28px"></div>
    </div>

    
    <!-- Status Bar -->
    <div id="status-bar">
      <span id="cursor-position">Line 1, Col 1</span>
      <span id="word-count">0 words</span>
    </div>
  </div>

  <!-- Load renderer script -->
  <script src="renderer.js"></script>
  <script src="markdown.js"></script>
  <script src="codemirror.js"></script>
</body>
</html>
